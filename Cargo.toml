[package]
name = "filter_controller"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"]}
embassy-rp = { version = "0.8.0", features = ["rp235xa"]}
embassy-time = "0.5.0"
panic-probe = "1.0.0"
